<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rockPaperScissors.css" />
  </head>
  <body>
    <div class="headingName">
      <p>Rock Paper Scissors</p>
    </div>

    <div class="items1">
      <div class="first-item">
        <img src="images/rockP.png" alt="rock" class="rockImage" />
      </div>

      <div class="second-item">
        <img src="images/paperP.png" alt="paper" class="paperImage" />
      </div>

      <div class="third-item">
        <img src="images/scissorsP.png" alt="scissors" class="scissorsImage" />
      </div>
    </div>

    <div class="result">
      <div class="result1">
        <p></p>
      </div>
      <div class="resultWon">
        <p>won: 0</p>
      </div>
      <div class="resultLoss">
        <p>loss: 0</p>
      </div>
      <div class="resultTie">
        <p>tie: 0</p>
      </div>
    </div>

    <div class="resetS">
      <button class="resetB">Reset</button>
    </div>

    <script src="rockPaperScissors.js"></script>
  </body>
</html>
